name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Keeps one release PR open with the next version and changelog; merging it tags and releases.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC); provenance is attached automatically
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: npm ci --ignore-scripts
      # A version published by hand (the first release) or by an earlier run is skipped, not re-attempted.
      - id: published
        run: |
          spec="$(node -p "const p = require('./package.json'); p.name + '@' + p.version")"
          if [ -n "$(npm view "$spec" version 2>/dev/null)" ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      # prepublishOnly typechecks and tests; prepack builds dist.
      - if: ${{ steps.published.outputs.exists != 'true' }}
        run: npm publish
